<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MailLens</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header><span class="logo">M</span><h1>MailLens</h1></header>
      <p id="summary">Scanning this page…</p>
      <p id="verifier-status" role="status"></p>
      <div id="progress-container" style="display: none;">
        <div class="progress-bar">
          <div id="progress-bar-fill"></div>
        </div>
        <span id="progress-text">Verifying: 0/0</span>
      </div>
      <button id="verify-all" type="button">Verify all emails</button>
      <ul id="email-list" aria-live="polite"></ul>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
