<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MailLens settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>MailLens settings</h1>
      <p>MailLens sends checks to your local Deep Email Validator service.</p>
      <label for="api-url">Verifier service URL</label>
      <input id="api-url" type="url" placeholder="http://localhost:8787" />
      <button id="save" type="button">Save settings</button>
      <p id="status" role="status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
